[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false
ffi = false
fuzz = { runs = 256 }
invariant = { runs = 256 }

[rpc_endpoints]
alfajores = "${CELO_ALFAJORES_RPC_URL}"
celo = "${CELO_MAINNET_RPC_URL}"

# Celoscan moved to the Etherscan V2 multichain API; the old
# api.celoscan.io/api (V1) is deprecated. Verification needs a (free)
# Etherscan API key in ETHERSCAN_API_KEY. See docs/celo-mainnet-deployment.md.
[etherscan]
alfajores = { key = "${ETHERSCAN_API_KEY}", chain = 44787, url = "https://api.etherscan.io/v2/api" }
celo = { key = "${ETHERSCAN_API_KEY}", chain = 42220, url = "https://api.etherscan.io/v2/api" }
