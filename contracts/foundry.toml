[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false
ffi = false
fuzz = { runs = 256 }
invariant = { runs = 256 }

[profile.default.rpc_endpoints]
alfajores = "${CELO_ALFAJORES_RPC_URL}"
celo = "${CELO_MAINNET_RPC_URL}"

[etherscan]
alfajores = { key = "${ETHERSCAN_API_KEY}", url = "https://api-alfajores.celoscan.io/api" }
celo = { key = "${ETHERSCAN_API_KEY}", url = "https://api.celoscan.io/api" }
